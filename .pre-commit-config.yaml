# 1. Add this at the very top of the file
default_stages: [pre-commit]

repos:
# 1. General house-keeping hooks
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml

# 2. Ruff: Fast Linting & Formatting
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format

# 3. Pytest: Your local test suite
-   repo: local
    hooks:
    -   id: pytest
        name: Run Pytest
        entry: ./venv/bin/python -m pytest -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
